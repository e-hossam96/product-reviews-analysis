services:
  caddy:
    image: caddy:2-alpine
    container_name: reviews-caddy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # the certificates live here: keep this volume
      - caddy-config:/config
    depends_on:
      - frontend
    networks:
      - default

  frontend:
    ports: !reset [] # only Caddy is reachable from outside now

volumes:
  caddy-data:
  caddy-config:
