<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1119" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product reviews analysis</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (Open Graph and Twitter/X cards). Crawlers need absolute URLs:
         change the domain here if you deploy the app somewhere else. -->
    <meta name="description" content="Upload customer reviews and see how people feel about each aspect of a product. Runs on a small local language model." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Product reviews analysis" />
    <meta property="og:title" content="Product reviews analysis" />
    <meta property="og:description" content="Upload customer reviews and see how people feel about each aspect of a product. Runs on a small local language model." />
    <meta property="og:url" content="https://reviews-demo.hossammostafa.ai/" />
    <meta property="og:image" content="https://reviews-demo.hossammostafa.ai/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Product reviews analysis: average score for each product aspect, shown as bars" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply a pinned light/dark choice before the first paint (see src/theme.ts).
      try {
        var theme = localStorage.getItem('reviews-analysis.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
