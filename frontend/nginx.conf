server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Real client address. Caddy runs in front of this container and puts the visitor's
    # address in X-Forwarded-For; it is trusted only when the request comes from the
    # compose network (the subnet is fixed in compose.yml).
    set_real_ip_from 172.30.0.0/24;
    real_ip_header X-Forwarded-For;

    # The backend shares the app network (172.30.1.0/24) with this container only so
    # nginx can proxy to it; requests the other way are refused. That subnet is not in
    # set_real_ip_from, so a forged X-Forwarded-For can't get around this.
    deny 172.30.1.0/24;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Must stay above SESSION_MAX_UPLOAD_MB (10 by default), so that an oversized
    # CSV is refused by the app with a readable message and not by nginx with a 413.
    client_max_body_size 12m;

    # Built assets have content hashes in their names: cache them for a year
    location /assets/ {
        expires 1y;
        # add_header in a location replaces the server-level ones, so repeat them
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # Never cache the page that points at those assets
    location = /index.html {
        expires -1;
    }

    # Single-page app: unknown paths get index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls go to the backend container
    location /api/ {
        proxy_pass http://backend:11696;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, don't append: nginx is the edge here, and a client-supplied
        # X-Forwarded-For would otherwise let anyone dodge the rate limits.
        # (Behind another load balancer, use the realip module instead.)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
