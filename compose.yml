services:
  backend:
    image: reviews-analysis-backend:${APPLICATION_VERSION:-latest}
    container_name: reviews-backend
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      # Inside Docker the LLM is reached by service name, whatever .env says
      # (.env points at localhost for running the backend with `uv run`).
      OPENAI_API_BASE: http://llamacpp:8000/v1
      # One request per llama-server slot
      PERFORMANCE_OPENAI_CONCURRENT_REQUESTS: ${LLM_PARALLEL:-4}
    stop_grace_period: 30s
    depends_on:
      llamacpp:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:11696/api/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - backend-data:/app/backend/data
      - backend-logs:/app/backend/logs
    # app: reached by the frontend. llm: reaches llamacpp, and the internet
    # (Langfuse tracing).
    networks:
      - app
      - llm

  frontend:
    image: reviews-analysis-frontend:${APPLICATION_VERSION:-latest}
    container_name: reviews-frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - ${FRONTEND_PORT:-80}:80
    depends_on:
      backend:
        condition: service_healthy
    # Not on llm, so llamacpp is unreachable from here
    networks:
      - public
      - app

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-b9744
    container_name: reviews-llamacpp
    restart: unless-stopped
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    # --ctx-size is shared between the slots: 16384 / 4 = 4096 tokens per request.
    # Keep PERFORMANCE_OPENAI_CONCURRENT_REQUESTS equal to --parallel (LLM_PARALLEL
    # does both) and raise --ctx-size in proportion if you raise it.
    command: >
      --host 0.0.0.0
      --port 8000
      --hf-repo unsloth/Qwen3.5-2B-GGUF:Q4_K_M
      --n-gpu-layers 0
      --threads ${LLM_THREADS:-4}
      --parallel ${LLM_PARALLEL:-4}
      --ctx-size 16384
      --seed 42
      --temperature 0.0
      --reasoning off
      --no-mmproj
      --no-ui
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8000/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 360s
    # Shared with the backend only. Not internal: the model is downloaded at startup.
    networks:
      - llm

networks:
  # Edge: frontend (+ Caddy in prod)
  public:
    name: reviews-public
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # frontend -> backend. Internal: no internet access through it.
  app:
    name: reviews-app
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.1.0/24
  # backend -> llamacpp
  llm:
    name: reviews-llm
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.2.0/24

volumes:
  # Same name the earlier `docker run` experiments used, so the model that is
  # already downloaded gets reused instead of fetched again.
  huggingface-cache:
    name: huggingface-cache
  backend-data:
  backend-logs:
